; Single-Pi development profile. Buffers are manual.
; Rate/Bits are discovered from the running peer; this file does not change it.
; Manual starting profile passed a 300-second fresh-build 8x8/192000/PCM24 test.
; guard1024 had late/missing frames in a separate fresh-build window.
; Revalidate with the actual callback/DAW. This file never retunes buffers.
[AoIP]
PeerIp=192.168.1.2
Rate=192000
Bits=24
BufferFrames=256
SafetyFrames=1536
CaptureFrames=32
InputMask=00000000000000ff
OutputMask=00000000000000ff
EnergySaving=0
AudioSpinUs=20
AudioCpu=-1
ReceiveCpu=-1
TransmitCpu=-1

[Service]
; Optional exact 32-character lowercase DeviceId from PIAOIP_IDENTITY_V1.
; Empty pins the first connected DeviceId for this process lifetime.
DeviceId=
